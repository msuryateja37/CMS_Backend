name: Node.js CI

# This section tells GitHub when to run the action
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# This section defines the actual tasks (jobs) to run
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code
    - uses: actions/checkout@v4

    # 2. Set up the Node.js environment
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x' # Using Node 20.x, adjust if you use a different version

    # 3. Install dependencies
    - name: Install dependencies
      run: npm ci

    # 4. Generate Prisma Client (Required before building)
    - name: Generate Prisma Client
      run: npx prisma generate

    # 5. Build the NestJS project
    - name: Build project
      run: npm run build
